<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Approval Form</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Reset and fonts */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
body { background: #f4f6f8; }

/* Navbar */
.navbar {
    background: #007bff;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.navbar a { color: white; text-decoration: none; font-weight: 500; margin-left: 15px; }
.navbar a:hover { text-decoration: underline; }

/* Container */
.container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

/* Logo */
.logo { display: block; margin: 0 auto 20px; max-width: 100px; }

/* Form styles */
h2 { text-align: center; margin-bottom: 25px; color: #333; }
label { display: block; margin: 12px 0 5px; font-weight: 500; color: #555; }
input, select {
    width: 100%;
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    transition: all 0.2s ease;
    font-size: 14px;
}
input:focus, select:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.3); }

/* Submit button */
button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
}
button:hover { background: #0056b3; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

/* Responsive adjustments */
@media (max-width: 650px) {
    .container { margin: 20px; padding: 25px; }
    button { font-size: 15px; padding: 12px; }
}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <span>Loan App</span>
    <div>
        <span>{{ session['email'] }}</span>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</div>

<!-- Loan Form Container -->
<div class="container">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
    <h2>Loan Approval Prediction</h2>
    <form action="/predict" method="post">
        <!-- Categorical features -->
        <label for="gender">Gender</label>
        <select id="gender" name="Gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label for="married">Married</label>
        <select id="married" name="Married">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label for="education">Education</label>
        <select id="education" name="Education">
            <option value="Graduate">Graduate</option>
            <option value="Not Graduate">Not Graduate</option>
        </select>

        <label for="self_employed">Self Employed</label>
        <select id="self_employed" name="Self_Employed">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label for="property_area">Property Area</label>
        <select id="property_area" name="Property_Area">
            <option value="Urban">Urban</option>
            <option value="Rural">Rural</option>
            <option value="Semiurban">Semiurban</option>
        </select>

        <!-- Numeric features -->
        <label for="dependents">Dependents</label>
        <input type="number" id="dependents" name="Dependents" required>

        <label for="applicant_income">Applicant Income (KES)</label>
        <input type="number" id="applicant_income" name="ApplicantIncome" required>

        <label for="coapplicant_income">Coapplicant Income (KES)</label>
        <input type="number" id="coapplicant_income" name="CoapplicantIncome" required>

        <label for="loan_amount">Loan Amount (KES)</label>
        <input type="number" id="loan_amount" name="LoanAmount" required>

        <label for="loan_term">Loan Term (months)</label>
        <input type="number" id="loan_term" name="Loan_Amount_Term" required>

        <label for="credit_history">Credit History (0 or 1)</label>
        <input type="number" id="credit_history" name="Credit_History" min="0" max="1" value="1">

        <button type="submit">Predict</button>
    </form>
</div>

</body>
</html>
